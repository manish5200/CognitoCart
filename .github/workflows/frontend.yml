name: 🚀 Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'cognitocart-ui/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'cognitocart-ui/**'

jobs:
  build:
    name: Build & Lint Angular App
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cognitocart-ui/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci
        working-directory: cognitocart-ui

      - name: 🔨 Build Angular app
        run: npm run build -- --configuration production
        working-directory: cognitocart-ui

      - name: ✅ Build succeeded
        run: echo "Frontend build passed successfully!"
