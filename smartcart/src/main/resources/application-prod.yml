server:
  port: ${PORT:8080}

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL:"CognitoCart <onboarding@resend.dev>"}

spring:
  main:
    lazy-initialization: true
  # From application.yml


  # From application-dev.yml
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
  flyway:
    enabled: true
    schemas: public
    default-schema: public
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    fail-on-missing-locations: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:cognitocart}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  rabbitmq:
    host: ${RABBITMQ_HOST:lionfish.rmq.cloudamqp.com}
    port: 5671
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    ssl:
      enabled: true

  data:
    redis:
      url: ${REDIS_URL}
      ssl:
        enabled: true

  cache:
    type: redis
    redis:
      key-prefix: "cognitocart::"
      use-key-prefix: true
      cache-null-values: false

# Cleaned up duplicate server block

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 900000
      refresh-token:
        expiration: 3600000

admin:
  email: admin@cognitocart.com
  password: ${ADMIN_PASSWORD}
  name: CognitoCart Admin
  phone: +917880589908

app:
  upload-dir: uploads/products/

# From application-dev.yml
razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

delhivery:
  api-token: ${DELHIVERY_API_TOKEN}
  base-url: https://staging-express.delhivery.com
  warehouse-name: Primary
  mock: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

huggingface:
  api-key: ${HUGGINGFACE_API_KEY}
  model: sentence-transformers/all-MiniLM-L6-v2

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, info
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com:
      manish:
        smartcart: INFO
